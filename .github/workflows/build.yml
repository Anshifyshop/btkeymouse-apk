name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: |
          if [ -d upload ] && [ -f upload/zip.txt ]; then
            mkdir -p app/src/main/assets site; cat upload/p* > site.zip
            [ "$(stat -c %s site.zip)" = "$(cat upload/size.txt)" ] || { echo SIZE MISMATCH; exit 1; }
            unzip -q site.zip -d site
            I=$(find site -name index.html | awk '{print gsub("/","/"), $0}' | sort -n | head -1 | cut -d' ' -f2)
            [ -n "$I" ] || { echo "NO index.html IN ZIP"; exit 1; }
            cp -r "$(dirname "$I")"/. app/src/main/assets/; rm -rf upload site site.zip
          fi
          if [ -d upload ]; then mkdir -p app/src/main/assets; cat upload/p* | gunzip > app/src/main/assets/index.html; [ "$(stat -c %s app/src/main/assets/index.html)" = "$(cat upload/size.txt)" ] || { echo SIZE MISMATCH; exit 1; }; rm -rf upload; fi
      - run: gradle assembleDebug --parallel --build-cache
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app.apk
          gh release create "b$RUN" app.apk --title "APK $RUN" --notes "Auto-built APK"
